name: Bounded change
description: Define one change and its acceptance, evidence, scope and human gates.
body:
  - type: textarea
    id: scope
    attributes:
      label: Problem, scope and dependencies
      description: Name the governing issue/phase/milestone, dependencies and their status, deliverable, and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance and evidence
      description: Specify independently observable outcomes, intended negative controls, evidence to retain, and scientific limits or decisions if relevant.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks, authority and stopping rules
      description: Name the risk viewpoints, scope or integrity stop conditions and required decisions. No resource estimate, reservation or command ledger is required (D-013). Review follows docs/WORKFLOW.md, including the narrow documentation lane only after Phase 0B.
    validations:
      required: true
  - type: textarea
    id: execution
    attributes:
      label: Candidate, checks, review and human handoff
      description: Record PR link, exact head/base and tested source identities, actual commands/results and gaps. Link required independent review or explain narrow-lane eligibility; preserve findings and dispositions with repair evidence. State human decisions, next action and owner. Follow docs/WORKFLOW.md; no merge by silence.
    validations:
      required: true
