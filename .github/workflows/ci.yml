name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTEST_PLUGINS: ""
      PYTHONDONTWRITEBYTECODE: "1"
      RUFF_NO_CACHE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record candidate and CPU allocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'event=%s\nsource_sha=%s\npr_head=%s\npr_base=%s\n' \
            "$EVENT_NAME" "$SOURCE_SHA" "$HEAD_SHA" "$BASE_SHA"
          printf 'logical_cpus=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          git log -1 --format='checkout_sha=%H%ncheckout_parents=%P'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.11"
          python-version: "3.12.9"
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked
      - name: Check lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Run serial tests with bounded resources
        run: |
          scratch="$RUNNER_TEMP/crucible-test-scratch"
          mkdir -p "$scratch"
          sudo mount -t tmpfs \
            -o "size=104857600,uid=$(id -u),gid=$(id -g),mode=700" \
            tmpfs "$scratch"
          trap 'du -sb "$scratch"; df -B1 "$scratch"; sudo umount "$scratch"' EXIT
          export TMPDIR="$scratch"
          printf 'test_address_space_limit_KiB=1048576\nscratch_limit_bytes=104857600\n'
          (
            ulimit -v 1048576
            /usr/bin/time -v uv run --no-sync pytest \
              -p no:cacheprovider --basetemp "$TMPDIR/pytest"
          )
