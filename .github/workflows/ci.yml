name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTEST_PLUGINS: ""
      PYTHONDONTWRITEBYTECODE: "1"
      RUFF_NO_CACHE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record candidate identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'event=%s\nsource_sha=%s\npr_head=%s\npr_base=%s\n' \
            "$EVENT_NAME" "$SOURCE_SHA" "$HEAD_SHA" "$BASE_SHA"
          git log -1 --format='checkout_sha=%H%ncheckout_parents=%P'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.11"
          python-version: "3.12.9"
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked --no-editable
      - name: Check lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Run serial tests
        run: |
          scratch="$RUNNER_TEMP/crucible-test-scratch"
          mkdir -p "$scratch"
          export TMPDIR="$scratch"
          uv run --no-sync pytest \
            -p no:cacheprovider --basetemp "$TMPDIR/pytest"
